plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.danon.radiorecordingapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.danon.radiorecordingapp"
        minSdk 24
        //noinspection EditedTargetSdkVersion
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // Main audio streaming library
    implementation libs.exoplayer
    implementation libs.exoplayer.core
    implementation libs.exoplayer.ui

    // For different stream formats
    implementation libs.exoplayer.hls
    implementation libs.exoplayer.dash

    // Background work scheduling
    implementation libs.work.runtime

    // Foreground services
    implementation libs.core
    implementation libs.lifecycle.service

    // For accessing radio station databases
    implementation libs.ffmpegmediametadataretriever
    // Or use direct API calls with:
    implementation libs.retrofit
    implementation libs.converter.gson

    // Basic Android UI components
    implementation libs.material.v1100
    implementation libs.constraintlayout

    // Storage and file handling
    implementation libs.documentfile

    // Permissions handling
    implementation libs.dexter
}